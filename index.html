<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather in Algeria</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Weather in Algeria</h1>

    <div class="card">
        <h2 id="city">Algiers</h2>
        <p id="description">Loading...</p>

        <ul>
            <li>Temperature: <span id="temp"></span> °C</li>
            <li>Feels like: <span id="feels"></span> °C</li>
            <li>Humidity: <span id="humidity"></span> %</li>
            <li>Precipitation: <span id="precipitation"></span> mm</li>
            <li>Wind speed: <span id="wind"></span> km/h</li>
        </ul>

        <p id="lastUpdate"></p>
    </div>

    <script src="app.js"></script>
</body>
</html>
